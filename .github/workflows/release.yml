name: Build & Release

# Publishes installers to a GitHub Release. Because electron-updater reads from
# GitHub Releases, pushing a version tag here is what makes the in-app
# "Check for updates" button find and download a new version.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate sources
        run: npm run lint

      - name: Generate icons
        run: node scripts/generate-icons.js

      # electron-builder publishes to the GitHub Release matching the tag.
      # GH_TOKEN is provided automatically to the workflow.
      - name: Build & publish (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
