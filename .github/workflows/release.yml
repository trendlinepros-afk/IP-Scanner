name: Build & Release

# Publishes installers to a GitHub Release. Because electron-updater reads from
# GitHub Releases, pushing a version tag here (or dispatching this workflow) is
# what makes the in-app "Check for updates" button find and download a new
# version.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Remove any pre-existing release/tag for the current version so the rebuild
  # is clean (no stale assets left behind from an earlier build). Runs once,
  # before the build matrix. Safe when nothing exists yet.
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Delete existing release & tag for this version (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          echo "Cleaning any existing release/tag $TAG"
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || echo "No release to delete"
          # Best-effort tag ref removal in case the tag lingered without a release.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" || echo "No tag ref to delete"

  build:
    needs: cleanup
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate sources
        run: npm run lint

      - name: Generate icons
        run: node scripts/generate-icons.js

      # electron-builder publishes to the GitHub Release matching the version.
      # GH_TOKEN is provided automatically to the workflow.
      - name: Build & publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
